name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install . pytest build fastapi pydantic
      - name: Lint (compile check)
        run: python -m compileall spiralreality_AIT_onepass_aifcore_integrated
      - name: Unit tests
        run: python -m pytest -q
      - name: Build distributions
        run: python -m build
      - name: Verify installed wheel outside the source tree
        run: |
          python -m venv /tmp/ait-wheel
          /tmp/ait-wheel/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/ait-wheel/bin/python -c "from spiralreality_AIT_onepass_aifcore_integrated.integrated.onepass_ait import OnePassAIT; m = OnePassAIT(latent_dim=16, encoder_layers=1); t = 'Hello world.'; assert ''.join(m.segment_text(t, use_aif=True)) == t"
          /tmp/ait-wheel/bin/python - <<'PY'
          import json
          import numpy as np
          from spiralreality_AIT_onepass_aifcore_integrated.integrated.onepass_ait import OnePassAIT, StudentTrainingConfig
          m = OnePassAIT(latent_dim=8, encoder_layers=1, encoder_heads=2, encoder_backend="numpy")
          before = m.encoder.Wq[0].copy()
          m.train_student(["ab cd"], [["ab", " ", "cd"]], StudentTrainingConfig(
              epochs=1, validation_split=0, phase_lr=0, train_context_encoder=True))
          assert not np.array_equal(before, m.encoder.Wq[0])
          restored = OnePassAIT(latent_dim=8, encoder_layers=1, encoder_heads=2, encoder_backend="numpy")
          restored.load_state_dict(json.loads(json.dumps(m.state_dict())))
          assert restored.segment_text("ab cd", include_confidence=True) == m.segment_text("ab cd", include_confidence=True)
          selection = m.select_policy_aif("ab cd")
          assert selection["selection_mode"] == "posterior_risk"
          assert selection["selected_risk"] <= selection["baseline_risk"]
          assert all(row["epistemic"] == 0 for row in selection["candidates"])
          PY
